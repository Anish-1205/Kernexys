[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kernexys"
version = "0.1.0"
description = "Local-first AI infrastructure control plane"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kernexys" }]
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.116,<1",
    "kubernetes-asyncio>=36.1,<37",
    "pydantic>=2.11,<3",
    "redis>=8.1,<9",
    "sqlalchemy[asyncio]>=2.0.43,<3",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.21,<1",
    "httpx>=0.28,<1",
    "pytest>=8.4,<10",
    "pytest-cov>=6.2,<8",
    "ruff>=0.12,<1",
]

[project.scripts]
kernexys-api = "app.__main__:main"
kernexysctl = "app.cli:main"
kernexys-worker = "app.worker:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: requires a real external dependency or local API server",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
