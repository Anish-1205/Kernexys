[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kernexys-model-runtime"
version = "0.1.0"
description = "Deterministic CPU-only reference inference runtime for Kernexys"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141,<1",
    "prometheus-client>=0.26,<1",
    "pydantic>=2.13,<3",
    "uvicorn>=0.52,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<10",
    "pytest-cov>=6.2,<8",
    "ruff>=0.12,<1",
]

[project.scripts]
kernexys-model-runtime = "runtime_app.__main__:main"

[tool.setuptools.packages.find]
include = ["runtime_app*"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["runtime_app"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
