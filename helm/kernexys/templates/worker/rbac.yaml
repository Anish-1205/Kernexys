{{- if .Values.worker.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kernexys-worker
  namespace: {{ .Values.namespace.workers }}
  labels:
    app: kernexys-worker
    {{- include "kernexys.labels" . | nindent 4 }}
rules:
  # Minimal permissions - workers don't manage Kubernetes resources.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kernexys-worker
  namespace: {{ .Values.namespace.workers }}
  labels:
    app: kernexys-worker
    {{- include "kernexys.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kernexys-worker
subjects:
  - kind: ServiceAccount
    name: {{ .Values.worker.serviceAccount.name }}
    namespace: {{ .Values.namespace.workers }}
{{- end }}
