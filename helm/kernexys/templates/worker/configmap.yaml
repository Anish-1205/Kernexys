{{- if .Values.worker.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: kernexys-worker
  namespace: {{ .Values.namespace.workers }}
  labels:
    app: kernexys-worker
    {{- include "kernexys.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.worker.env }}
  KERNEXYS_{{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
