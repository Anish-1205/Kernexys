{{- if and .Values.worker.enabled .Values.worker.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.worker.serviceAccount.name }}
  namespace: {{ .Values.namespace.workers }}
  labels:
    app: kernexys-worker
    {{- include "kernexys.labels" . | nindent 4 }}
{{- end }}
