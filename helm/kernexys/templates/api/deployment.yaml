{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kernexys-api
  namespace: {{ .Values.namespace.system }}
  labels:
    app: kernexys-api
    version: v1
    {{- include "kernexys.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: kernexys-api
  template:
    metadata:
      labels:
        app: kernexys-api
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.api.service.metricsPort | quote }}
    spec:
      serviceAccountName: {{ .Values.api.serviceAccount.name }}
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - kernexys-api
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534 # nobody
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: {{ include "kernexys.image" (dict "global" .Values.global "image" .Values.api.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - uvicorn
            - app.main:app
            - --host=0.0.0.0
            - --port=8000
            - --workers=2
          envFrom:
            - configMapRef:
                name: kernexys-api
          env:
            - name: KERNEXYS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.secrets.database.name }}
                  key: {{ .Values.api.secrets.database.key }}
            - name: KERNEXYS_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.secrets.redis.name }}
                  key: {{ .Values.api.secrets.redis.key }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.api.service.metricsPort }}
              protocol: TCP
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: var-tmp
              mountPath: /var/tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: var-tmp
          emptyDir:
            sizeLimit: 16Mi
{{- end }}
