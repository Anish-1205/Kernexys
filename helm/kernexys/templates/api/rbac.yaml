{{- if .Values.api.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kernexys-api
  labels:
    app: kernexys-api
    {{- include "kernexys.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - platform.kernexys.io
    resources:
      - modeldeployments
    verbs:
      - create
      - delete
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kernexys-api
  labels:
    app: kernexys-api
    {{- include "kernexys.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kernexys-api
subjects:
  - kind: ServiceAccount
    name: {{ .Values.api.serviceAccount.name }}
    namespace: {{ .Values.namespace.system }}
{{- end }}
