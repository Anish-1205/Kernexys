{{- if .Values.api.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: kernexys-api
  namespace: {{ .Values.namespace.system }}
  labels:
    app: kernexys-api
    {{- include "kernexys.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: kernexys-api
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
    - name: metrics
      port: {{ .Values.api.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
{{- end }}
