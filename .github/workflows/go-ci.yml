name: Go Controller CI

on:
  push:
    branches: [main, feat/*, bugfix/*]
    paths:
      - 'controller/**'
      - '.github/workflows/go-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'controller/**'

jobs:
  lint:
    name: Lint Go Code
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.x'
    
    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest
        working-directory: controller

  test:
    name: Test Go Controller
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.x'
    
    - name: Download dependencies
      working-directory: controller
      run: go mod download
    
    - name: Run tests
      working-directory: controller
      run: go test -v -race -coverprofile=coverage.out ./...
    
    - name: Upload coverage
      uses: codecov/codecov-action@v7
      with:
        files: ./controller/coverage.out
        flags: controller
        fail_ci_if_error: false

  vet:
    name: Vet Go Code
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.x'
    
    - name: Run go vet
      working-directory: controller
      run: go vet ./...

  build:
    name: Build Go Controller
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.x'
    
    - name: Build controller binary
      working-directory: controller
      run: go build -o bin/manager cmd/main.go
    
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: controller-binary
        path: controller/bin/manager
