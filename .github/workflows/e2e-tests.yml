name: Kubernetes E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: E2E Tests on Kind
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.x'

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip

    - name: Create kind cluster
      uses: helm/kind-action@v1.15.0
      with:
        version: v0.33.0
        cluster_name: kernexys-test
        config: deploy/kind/config.yaml
        node_image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
        wait: 120s

    - name: Build and load API image
      run: |
        docker build -f Dockerfile -t kernexys/control-api:dev .
        kind load docker-image kernexys/control-api:dev --name kernexys-test

    - name: Build and load controller image
      run: |
        docker build -f controller/Dockerfile -t kernexys/controller:dev controller/
        kind load docker-image kernexys/controller:dev --name kernexys-test

    - name: Build and load runtime image
      run: |
        docker build --build-arg MODEL_VERSION=v1 -f runtime/Dockerfile -t kernexys/model-runtime:v1 runtime/
        docker build --build-arg MODEL_VERSION=v2 -f runtime/Dockerfile -t kernexys/model-runtime:v2 runtime/
        kind load docker-image kernexys/model-runtime:v1 kernexys/model-runtime:v2 --name kernexys-test

    - name: Deploy to kind cluster
      env:
        KERNEXYS_POSTGRES_PASSWORD: ci-only-url-safe-password
      run: make kind-install

    - name: Wait for deployments
      run: make kind-validate

    - name: Debug failed deployment
      if: failure()
      run: |
        echo "=== PODS ==="
        kubectl get pods -n kernexys-system -o wide

        echo "=== API LOGS ==="
        kubectl logs -n kernexys-system -l app=kernexys-api --all-containers=true --tail=200 || true

        echo "=== POD DETAILS ==="
        kubectl describe pod -n kernexys-system -l app=kernexys-api || true

        echo "=== CONTROLLER LOGS ==="
        kubectl logs -n kernexys-system -l app.kubernetes.io/name=kernexys-controller --all-containers=true --tail=200 || true

        echo "=== MIGRATION LOGS ==="
        kubectl logs -n kernexys-system -l app=kernexys-migrate --all-containers=true --tail=200 || true

        echo "=== NAMESPACE EVENTS ==="
        kubectl get events -n kernexys-system --sort-by=.lastTimestamp || true

        echo "=== NETWORK POLICIES ==="
        kubectl get networkpolicy -n kernexys-system -o yaml || true

        echo "=== READINESS RESPONSE ==="
        POD=$(kubectl get pods -n kernexys-system -l app=kernexys-api -o jsonpath='{.items[0].metadata.name}')
        kubectl port-forward -n kernexys-system pod/$POD 8000:8000 >/tmp/port-forward.log 2>&1 &
        sleep 3
        curl -sS http://localhost:8000/health/ready || true
        echo

    - name: Check API is responsive
      run: |
        kubectl -n kernexys-system port-forward svc/kernexys-api 8000:8000 &
        sleep 5
        curl --fail --show-error http://localhost:8000/health/live
        curl --fail --show-error http://localhost:8000/health/ready

    - name: Collect cluster logs
      if: always()
      run: |
        mkdir -p /tmp/e2e-logs
        kubectl describe nodes > /tmp/e2e-logs/nodes.txt
        kubectl describe pods -A > /tmp/e2e-logs/pods.txt
        kubectl logs -n kernexys-system -l app=kernexys-api --all-containers=true > /tmp/e2e-logs/api.log || true
        kubectl logs -n kernexys-system -l app.kubernetes.io/name=kernexys-controller --all-containers=true > /tmp/e2e-logs/controller.log || true
        kubectl get events -n kernexys-system --sort-by=.lastTimestamp > /tmp/e2e-logs/events.txt || true

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: e2e-logs
        path: /tmp/e2e-logs/
