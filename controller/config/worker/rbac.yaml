apiVersion: v1
kind: ServiceAccount
metadata:
  name: kernexys-worker
  namespace: kernexys-workers
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kernexys-worker
  namespace: kernexys-workers
rules:
# Minimal permissions - workers don't manage Kubernetes resources
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kernexys-worker
  namespace: kernexys-workers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kernexys-worker
subjects:
- kind: ServiceAccount
  name: kernexys-worker
  namespace: kernexys-workers
