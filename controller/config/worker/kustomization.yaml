apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kernexys-workers
resources:
  - namespace.yaml
  - rbac.yaml
  - deployment.yaml
  - keda.yaml
# See controller/config/api/kustomization.yaml: `commonLabels` rewrites
# NetworkPolicy peer selectors, so use `labels` with selectors excluded.
labels:
  - pairs:
      component: inference-workers
    includeSelectors: false
