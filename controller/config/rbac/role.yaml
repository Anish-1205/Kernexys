---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kernexys-controller-role
rules:
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - platform.kernexys.io
  resources:
  - modeldeployments
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - platform.kernexys.io
  resources:
  - modeldeployments/status
  verbs:
  - get
  - patch
  - update
