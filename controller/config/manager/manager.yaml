apiVersion: v1
kind: ServiceAccount
metadata:
  name: kernexys-controller
  namespace: kernexys-system
  labels:
    app.kubernetes.io/name: kernexys-controller
    app.kubernetes.io/part-of: kernexys
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kernexys-controller
  namespace: kernexys-system
  labels:
    app.kubernetes.io/name: kernexys-controller
    app.kubernetes.io/part-of: kernexys
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kernexys-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kernexys-controller
        app.kubernetes.io/part-of: kernexys
    spec:
      serviceAccountName: kernexys-controller
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: controller
          image: kernexys/controller:dev
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
