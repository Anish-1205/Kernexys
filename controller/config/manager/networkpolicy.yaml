apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kernexys-controller
  namespace: kernexys-system
spec:
  # kernexys-deny-all also selects this pod; without these egress rules the
  # controller cannot reach the API server once its existing connection drops.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kernexys-controller
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          component: kube-apiserver
    ports:
    - protocol: TCP
      port: 443
  # kind exposes the API through a Service VIP backed by a host-network process.
  # NetworkPolicy implementations may evaluate either address around DNAT.
  - to:
    - ipBlock:
        cidr: 10.96.0.1/32
    ports:
    - protocol: TCP
      port: 443
  - to:
    - ipBlock:
        cidr: 172.18.0.0/16
    ports:
    - protocol: TCP
      port: 6443
