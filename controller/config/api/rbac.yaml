apiVersion: v1
kind: ServiceAccount
metadata:
  name: kernexys-api
  namespace: kernexys-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kernexys-api
rules:
- apiGroups:
  - platform.kernexys.io
  resources:
  - modeldeployments
  verbs:
  - create
  - delete
  - get
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kernexys-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kernexys-api
subjects:
- kind: ServiceAccount
  name: kernexys-api
  namespace: kernexys-system
