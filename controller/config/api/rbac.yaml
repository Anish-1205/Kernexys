apiVersion: v1
kind: ServiceAccount
metadata:
  name: kernexys-api
  namespace: kernexys-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kernexys-api
rules:
# Model deployments management
- apiGroups: ["platform.kernexys.io"]
  resources: ["modeldeployments"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: ["platform.kernexys.io"]
  resources: ["modeldeployments/status"]
  verbs: ["get", "patch", "update"]
# Read Kubernetes deployments and services for status
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["endpoints"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kernexys-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kernexys-api
subjects:
- kind: ServiceAccount
  name: kernexys-api
  namespace: kernexys-system
