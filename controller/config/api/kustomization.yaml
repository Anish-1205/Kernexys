apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kernexys-system
resources:
  - namespace.yaml
  - rbac.yaml
  - deployment.yaml
  - networkpolicy.yaml
# Use `labels` (not the deprecated `commonLabels`) so the marker label is added
# to resource metadata only. `commonLabels` also rewrites NetworkPolicy
# ingress/egress peer selectors, which silently made every egress rule here
# (Postgres, DNS, kube-apiserver) match nothing and broke API readiness.
labels:
  - pairs:
      component: control-api
    includeSelectors: false
