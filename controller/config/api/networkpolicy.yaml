apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kernexys-api
  namespace: kernexys-system
spec:
  podSelector:
    matchLabels:
      app: kernexys-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow from Ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8000
  # Allow from monitoring (Prometheus scraping)
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 8001
  egress:
  # Allow DNS for service discovery
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
  # Allow to PostgreSQL
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  # Allow to Redis
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  # Allow to Kubernetes API
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          component: kube-apiserver
    ports:
    - protocol: TCP
      port: 443
  # kind exposes the API through a Service VIP backed by a host-network process.
  # NetworkPolicy implementations may evaluate either address around DNAT.
  - to:
    - ipBlock:
        cidr: 10.96.0.1/32
    ports:
    - protocol: TCP
      port: 443
  - to:
    - ipBlock:
        cidr: 172.18.0.0/16
    ports:
    - protocol: TCP
      port: 6443
  # Allow to workers for async queue management
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kernexys-workers
      podSelector:
        matchLabels:
          app: kernexys-worker
    ports:
    - protocol: TCP
      port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kernexys-deny-all
  namespace: kernexys-system
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
