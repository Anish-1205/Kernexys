apiVersion: apps/v1
kind: Deployment
metadata:
  name: kernexys-api
  namespace: kernexys-system
  labels:
    app: kernexys-api
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: kernexys-api
  template:
    metadata:
      labels:
        app: kernexys-api
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
    spec:
      serviceAccountName: kernexys-api
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - kernexys-api
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534  # nobody
        fsReadOnlyRootFilesystem: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api
        image: kernexys:latest
        imagePullPolicy: IfNotPresent
        command:
        - uvicorn
        - app.main:app
        - --host=0.0.0.0
        - --port=8000
        - --workers=2
        env:
        - name: KERNEXYS_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: kernexys-db
              key: url
        - name: KERNEXYS_KUBERNETES_ENABLED
          value: "true"
        - name: KERNEXYS_KUBERNETES_CONFIG_MODE
          value: "in-cluster"
        - name: KERNEXYS_ASYNC_INFERENCE_ENABLED
          value: "true"
        - name: KERNEXYS_REDIS_URL
          valueFrom:
            secretKeyRef:
              name: kernexys-redis
              key: url
        - name: KERNEXYS_LOG_LEVEL
          value: "INFO"
        - name: KERNEXYS_SERVER_LIMIT_CONCURRENCY
          value: "100"
        - name: KERNEXYS_MAX_REQUEST_BYTES
          value: "1048576"
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: var-tmp
          mountPath: /var/tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 16Mi
      - name: var-tmp
        emptyDir:
          sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kernexys-api
  namespace: kernexys-system
  labels:
    app: kernexys-api
spec:
  type: ClusterIP
  selector:
    app: kernexys-api
  ports:
  - name: http
    port: 8000
    targetPort: http
    protocol: TCP
